<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="gBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2980b9"/><stop offset="100%" stop-color="#1b4f72"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e67e22"/><stop offset="100%" stop-color="#b9770e"/>
    </linearGradient>
    <linearGradient id="gPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8e44ad"/><stop offset="100%" stop-color="#5b2c6f"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27ae60"/><stop offset="100%" stop-color="#196f3d"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7f8c8d"/>
    </marker>
  </defs>

  <!-- Main Header Banner -->
  <rect x="20" y="15" width="940" height="52" rx="6" fill="#1b4f72"/>
  <text x="35" y="44" fill="#ffffff" font-size="16" font-weight="700">DESIGN ARTEFACT: HOUSEHOLD BESS RUL FORECASTING WORKFLOW</text>
  <text x="795" y="44" fill="#d4e6f1" font-size="11.5" font-weight="500">EECS Masters Thesis</text>

  <!-- ==================== STEP 1 ==================== -->
  <g transform="translate(20, 78)">
    <rect width="215" height="420" rx="8" fill="#ebf5fb" stroke="#aed6f1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="215" height="38" rx="8" fill="url(#gBlue)"/>
    <rect y="30" width="215" height="8" fill="url(#gBlue)"/>
    <text x="10" y="24" fill="#ffffff" font-size="10.5" font-weight="700">STEP 1: BESS &amp; DATA SELECTION</text>

    <!-- Sub-box 1.1 -->
    <rect x="10" y="48" width="195" height="85" rx="5" fill="#ffffff" stroke="#d4e6f1"/>
    <text x="18" y="66" fill="#1b4f72" font-size="10.5" font-weight="700">Household BESS Context</text>
    <text x="18" y="82" fill="#555555" font-size="9.5">• Target Chemistries: LFP &amp; NMC</text>
    <text x="18" y="97" fill="#555555" font-size="9.5">• LFP: Thermal Safety, Long Life</text>
    <text x="18" y="112" fill="#555555" font-size="9.5">• NMC: High Energy Density</text>
    <text x="18" y="126" fill="#2980b9" font-size="8.5" font-weight="600">Industrial Relevance Baseline</text>

    <!-- Sub-box 1.2 -->
    <rect x="10" y="141" width="195" height="125" rx="5" fill="#ffffff" stroke="#d4e6f1"/>
    <text x="18" y="159" fill="#1b4f72" font-size="10.5" font-weight="700">Authoritative Databases</text>
    <text x="18" y="176" fill="#2980b9" font-size="9.5" font-weight="700">1. NASA PCoE (LCO 18650):</text>
    <text x="24" y="191" fill="#555555" font-size="9">• 2.0 Ah, 24°C, 4°C, 43°C, EIS</text>
    <text x="18" y="209" fill="#8e44ad" font-size="9.5" font-weight="700">2. CALCE / Stanford (NMC/LFP):</text>
    <text x="24" y="224" fill="#555555" font-size="9">• 1.1 - 1.35 Ah Prismatic / 18650</text>
    <text x="24" y="239" fill="#555555" font-size="9">• CC-CV &amp; Fast Aging Profiles</text>
    <text x="18" y="256" fill="#27ae60" font-size="8.5" font-weight="600">Eliminates Single-Source Bias</text>

    <!-- Sub-box 1.3 -->
    <rect x="10" y="274" width="195" height="132" rx="5" fill="#ffffff" stroke="#d4e6f1"/>
    <text x="18" y="293" fill="#1b4f72" font-size="10.5" font-weight="700">Synchronized Channels</text>
    <text x="18" y="311" fill="#555555" font-size="9.5">• Voltage V(t) [V]</text>
    <text x="18" y="327" fill="#555555" font-size="9.5">• Current I(t) [A]</text>
    <text x="18" y="343" fill="#555555" font-size="9.5">• Surface Temp T(t) [°C]</text>
    <text x="18" y="359" fill="#555555" font-size="9.5">• EIS Ohmic Re &amp; Charge Rct</text>
    <text x="18" y="380" fill="#7f8c8d" font-size="8.5">Why? High-fidelity multi-channel</text>
    <text x="18" y="394" fill="#7f8c8d" font-size="8.5">data across real cell chemistries.</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 235 285 L 257 285" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ==================== STEP 2 ==================== -->
  <g transform="translate(262, 78)">
    <rect width="220" height="420" rx="8" fill="#fef9e7" stroke="#f9e79f" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="220" height="38" rx="8" fill="url(#gOrange)"/>
    <rect y="30" width="220" height="8" fill="url(#gOrange)"/>
    <text x="10" y="24" fill="#ffffff" font-size="10.5" font-weight="700">STEP 2: FACTOR RANKING (PHASE 1)</text>

    <!-- Sub-box 2.1 -->
    <rect x="10" y="48" width="200" height="105" rx="5" fill="#ffffff" stroke="#fcf3cf"/>
    <text x="18" y="66" fill="#7d6608" font-size="10.5" font-weight="700">Candidate Health Indicators (HIs)</text>
    <text x="18" y="84" fill="#555555" font-size="9.5">• Discharge Duration (Δt)</text>
    <text x="18" y="100" fill="#555555" font-size="9.5">• Voltage Drop Time (3.8V → 3.4V)</text>
    <text x="18" y="116" fill="#555555" font-size="9.5">• Peak Temp Rise (ΔT_max)</text>
    <text x="18" y="132" fill="#555555" font-size="9.5">• Internal Resistance (Re, Rct)</text>
    <text x="18" y="146" fill="#e67e22" font-size="8.5" font-weight="600">Physical Degradation Proxies</text>

    <!-- Sub-box 2.2 -->
    <rect x="10" y="161" width="200" height="120" rx="5" fill="#ffffff" stroke="#fcf3cf"/>
    <text x="18" y="180" fill="#7d6608" font-size="10.5" font-weight="700">Mathematical Ranking Methods</text>
    <text x="18" y="198" fill="#333333" font-size="9.5">• <strong>Pearson (r):</strong> Linear correlation</text>
    <text x="18" y="214" fill="#333333" font-size="9.5">• <strong>Spearman (ρ):</strong> Monotonic decay</text>
    <text x="18" y="230" fill="#333333" font-size="9.5">• <strong>Grey Relational Analysis (GRA):</strong></text>
    <text x="24" y="246" fill="#b9770e" font-size="9">Geometric curve similarity</text>
    <text x="18" y="267" fill="#7f8c8d" font-size="8.5">Why? Quantifies factor decay</text>
    <text x="18" y="279" fill="#7f8c8d" font-size="8.5">without assuming simple linearity.</text>

    <!-- Sub-box 2.3 -->
    <rect x="10" y="290" width="200" height="116" rx="5" fill="#ffffff" stroke="#fcf3cf"/>
    <text x="18" y="309" fill="#7d6608" font-size="10.5" font-weight="700">Cross-Database Comparison</text>
    <text x="18" y="327" fill="#555555" font-size="9.5">• Compare factor ranks in LFP/NMC/LCO</text>
    <text x="18" y="343" fill="#555555" font-size="9.5">• Identify universal vs. chemistry-specific HIs</text>
    <text x="18" y="359" fill="#c0392b" font-size="9.5">• Filter collinearity &amp; select |ρ| &gt; 0.85</text>
    <text x="18" y="381" fill="#7f8c8d" font-size="8.5">Why? Eliminates redundant noise</text>
    <text x="18" y="395" fill="#7f8c8d" font-size="8.5">before training machine learning.</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 482 285 L 504 285" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ==================== STEP 3 ==================== -->
  <g transform="translate(509, 78)">
    <rect width="220" height="420" rx="8" fill="#f4ecf7" stroke="#d2b4de" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="220" height="38" rx="8" fill="url(#gPurple)"/>
    <rect y="30" width="220" height="8" fill="url(#gPurple)"/>
    <text x="10" y="24" fill="#ffffff" font-size="10.5" font-weight="700">STEP 3: GENERAL FORECASTING</text>

    <!-- Sub-box 3.1 -->
    <rect x="10" y="48" width="200" height="105" rx="5" fill="#ffffff" stroke="#ebdef0"/>
    <text x="18" y="66" fill="#512e5f" font-size="10.5" font-weight="700">Dimensionless Normalization</text>
    <text x="18" y="84" fill="#555555" font-size="9.5">• State of Health: SoH = Q_k / Q_0</text>
    <text x="18" y="100" fill="#555555" font-size="9.5">• Normalized SOC decay interval ratio</text>
    <text x="18" y="116" fill="#555555" font-size="9.5">• Relative temp rise rate ΔT / Δt</text>
    <text x="18" y="136" fill="#7f8c8d" font-size="8.5">Why? Bridges capacity (2.0 vs 1.1 Ah)</text>
    <text x="18" y="148" fill="#7f8c8d" font-size="8.5">&amp; voltage plateau (LFP vs NMC) gaps.</text>

    <!-- Sub-box 3.2 -->
    <rect x="10" y="161" width="200" height="110" rx="5" fill="#ffffff" stroke="#ebdef0"/>
    <text x="18" y="180" fill="#512e5f" font-size="10.5" font-weight="700">Track A: Conventional ML</text>
    <text x="18" y="198" fill="#333333" font-size="9.5">• SVR (RBF Kernel, C=10, ε=0.1)</text>
    <text x="18" y="214" fill="#333333" font-size="9.5">• Random Forest (100 Trees, Depth 6)</text>
    <text x="18" y="230" fill="#333333" font-size="9.5">• Extreme Gradient Boosting (XGBoost)</text>
    <text x="18" y="250" fill="#7f8c8d" font-size="8.5">Why? High interpretability &amp; low</text>
    <text x="18" y="264" fill="#7f8c8d" font-size="8.5">compute for edge BMS hardware chips.</text>

    <!-- Sub-box 3.3 -->
    <rect x="10" y="280" width="200" height="126" rx="5" fill="#ffffff" stroke="#ebdef0"/>
    <text x="18" y="299" fill="#512e5f" font-size="10.5" font-weight="700">Track B: Deep Transfer Learning</text>
    <text x="18" y="317" fill="#333333" font-size="9.5">• 1D-CNN: Local voltage dynamics</text>
    <text x="18" y="333" fill="#333333" font-size="9.5">• BiLSTM: Cycle degradation memory</text>
    <text x="18" y="349" fill="#8e44ad" font-size="9" font-weight="600">• Pre-train on NASA ➔ Tune on CALCE</text>
    <text x="18" y="371" fill="#7f8c8d" font-size="8.5">Why? Handles capacity regeneration</text>
    <text x="18" y="385" fill="#7f8c8d" font-size="8.5">&amp; few-shot cold-start on new cells.</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 729 285 L 751 285" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ==================== STEP 4 ==================== -->
  <g transform="translate(756, 78)">
    <rect width="204" height="420" rx="8" fill="#eafaf1" stroke="#a9dfbf" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="204" height="38" rx="8" fill="url(#gGreen)"/>
    <rect y="30" width="204" height="8" fill="url(#gGreen)"/>
    <text x="10" y="24" fill="#ffffff" font-size="10.5" font-weight="700">STEP 4: TEST &amp; VALIDATION</text>

    <!-- Sub-box 4.1 -->
    <rect x="10" y="48" width="184" height="105" rx="5" fill="#ffffff" stroke="#d5f5e3"/>
    <text x="18" y="66" fill="#145a32" font-size="10.5" font-weight="700">Multi-Tier Validation</text>
    <text x="18" y="84" fill="#555555" font-size="9.5">• <strong>In-Domain:</strong> Unseen cell B0018</text>
    <text x="18" y="100" fill="#555555" font-size="9.5">• <strong>Zero-Shot:</strong> NASA ➔ CALCE</text>
    <text x="18" y="116" fill="#555555" font-size="9.5">• <strong>Few-Shot:</strong> Target first 20 cycles</text>
    <text x="18" y="136" fill="#7f8c8d" font-size="8.5">Why? Prevents data leakage and</text>
    <text x="18" y="148" fill="#7f8c8d" font-size="8.5">evaluates true cross-cell transfer.</text>

    <!-- Sub-box 4.2 -->
    <rect x="10" y="161" width="184" height="110" rx="5" fill="#ffffff" stroke="#d5f5e3"/>
    <text x="18" y="180" fill="#145a32" font-size="10.5" font-weight="700">Evaluation Metrics</text>
    <text x="18" y="198" fill="#333333" font-size="9.5">• RMSE &amp; MAE [Cycles]</text>
    <text x="18" y="214" fill="#333333" font-size="9.5">• R² Regression Fitness</text>
    <text x="18" y="230" fill="#c0392b" font-size="9" font-weight="700">• NASA Asymmetric Score (PHM)</text>
    <text x="18" y="250" fill="#7f8c8d" font-size="8.5">Why? Penalizes late predictions</text>
    <text x="18" y="264" fill="#7f8c8d" font-size="8.5">to guarantee BESS safety margin.</text>

    <!-- Sub-box 4.3 -->
    <rect x="10" y="280" width="184" height="126" rx="5" fill="#ffffff" stroke="#d5f5e3"/>
    <text x="18" y="299" fill="#145a32" font-size="10.5" font-weight="700">Household BESS Support</text>
    <text x="18" y="317" fill="#555555" font-size="9.5">• 80% EOL Threshold Warning</text>
    <text x="18" y="333" fill="#555555" font-size="9.5">• Predictive Replacement Plan</text>
    <text x="18" y="349" fill="#555555" font-size="9.5">• Cell Balancing Optimization</text>
    <text x="18" y="371" fill="#7f8c8d" font-size="8.5">Why? Connects machine learning</text>
    <text x="18" y="385" fill="#7f8c8d" font-size="8.5">predictions to asset reliability.</text>
  </g>

  <!-- Bottom Infrastructure & Governance Banner -->
  <g transform="translate(20, 510)">
    <rect width="940" height="72" rx="6" fill="#1b2631" filter="url(#shadow)"/>
    <text x="25" y="533" fill="#f1c40f" font-size="11" font-weight="700">ENGINEERING INFRASTRUCTURE, REPRODUCIBILITY &amp; GOVERNANCE LAYER</text>
    <text x="25" y="552" fill="#ecf0f1" font-size="9.8">
      • Environment: Python 3.11 locked via <tspan fill="#3498db" font-weight="700">uv</tspan> &amp; <tspan fill="#3498db" font-weight="700">pyproject.toml</tspan>   • Stack: PyTorch 2.13, Scikit-Learn 1.9, XGBoost 3.2, SciPy
    </text>
    <text x="25" y="569" fill="#bdc3c7" font-size="9.2">
      • Version Control &amp; Public Digital Resource: <tspan fill="#58a6ff" font-weight="bold">https://github.com/Rrydicy/Thesis-project-</tspan>
    </text>
  </g>
</svg>
